appId: org.brainana.align
productName: Brainana Align
asar: true
npmRebuild: false
artifactName: Brainana-Align-${version}-${arch}.${ext}
directories:
  output: apps/align/release
  buildResources: apps/align/build
files:
  - apps/align/desktop.mjs
  - apps/align/desktop/**/*.mjs
  - apps/align/server.mjs
  - apps/align/platformCore.mjs
  - apps/align/sftpClient.mjs
  - apps/align/version.mjs
  - apps/align/VERSION.json
  - apps/align/dist/**/*
  - package.json
  - LICENSE
  - NOTICE.txt
  - '!**/*.ts'
  - '!**/*.map'
  - '!**/tests/**'
electronLanguages: [en-US]
mac:
  extraResources:
    - from: generated/scientific-runtime
      to: scientific-runtime
    - from: generated/workstation-support
      to: workstation-support
  target: [dir]
  category: public.app-category.medical
  identity: null
  minimumSystemVersion: '14.0'
  bundleVersion: '1710'
  bundleShortVersion: '0.17.10'
  mergeASARs: true
  extendInfo:
    BrainanaReleaseVersion: 0.17.10
    BrainanaBuildID: 0.17.10
win:
  extraResources:
    - from: generated/scientific-runtime
      to: scientific-runtime
  target: [nsis, zip]
  artifactName: Brainana-Align-Windows-${version}-${arch}.${ext}
  signExecutable: false
nsis:
  artifactName: Brainana-Align-Setup-${version}-${arch}.exe
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Brainana Align
linux:
  extraResources:
    - from: generated/scientific-runtime
      to: scientific-runtime
  target: [deb, tar.gz]
  executableName: brainana-align
  syncDesktopName: true
  artifactName: Brainana-Align-Ubuntu-${version}-${arch}.${ext}
  category: Science
  maintainer: Brainana
  vendor: Brainana

deb:
  packageCategory: science
  depends:
    - libc6
    - libgcc-s1
    - libglib2.0-0t64 | libglib2.0-0
    - libgtk-3-0t64 | libgtk-3-0
    - libatk1.0-0t64 | libatk1.0-0
    - libatk-bridge2.0-0t64 | libatk-bridge2.0-0
    - libatspi2.0-0t64 | libatspi2.0-0
    - libcups2t64 | libcups2
    - libasound2t64 | libasound2
    - libnspr4
    - libnss3
    - libdbus-1-3
    - libcairo2
    - libpango-1.0-0
    - libx11-6
    - libxcomposite1
    - libxdamage1
    - libxext6
    - libxfixes3
    - libxrandr2
    - libgbm1
    - libexpat1
    - libxcb1
    - libxkbcommon0
    - libudev1
    - libnotify4
    - libxss1
    - libxtst6
    - xdg-utils
    - libuuid1
    - libsecret-1-0
